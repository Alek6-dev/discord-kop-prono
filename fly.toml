app = "discord-kop-prono"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ADMIN_HOST = "0.0.0.0"
  ADMIN_PORT = "3000"

[deploy]
  release_command = "npm run start:migrate"

[processes]
  app = "npm run start:app"

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/health"
